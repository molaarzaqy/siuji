basePath: /api/v1
definitions:
  model.AuthResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      temp_token:
        type: string
      user:
        $ref: '#/definitions/model.UserResponse'
    type: object
  model.ChangePasswordRequest:
    properties:
      confirm_new_password:
        type: string
      new_password:
        minLength: 8
        type: string
      old_password:
        type: string
    required:
    - confirm_new_password
    - new_password
    - old_password
    type: object
  model.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  model.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  model.ResetPasswordRequest:
    properties:
      confirm_new_password:
        type: string
      new_password:
        minLength: 8
        type: string
    required:
    - confirm_new_password
    - new_password
    type: object
  model.UserResponse:
    properties:
      email:
        type: string
      name:
        type: string
      nim:
        type: string
      public_id:
        type: string
      role:
        type: string
      university:
        type: string
      updated_at:
        type: string
    type: object
  model.VerifyOTPRequest:
    properties:
      otp_code:
        type: string
    required:
    - otp_code
    type: object
  response.Response:
    properties:
      data: {}
      message:
        type: string
      response_code:
        type: integer
      status:
        type: string
    type: object
  response.ResponseNoData:
    properties:
      message:
        type: string
      response_code:
        type: integer
      status:
        type: string
    type: object
info:
  contact: {}
  description: API documentation for Siuji TOEFL exam application.
  title: Siuji API
  version: "1.0"
paths:
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Change password for the currently authenticated user.
      parameters:
      - description: Old and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ResponseNoData'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ResponseNoData'
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - Auth
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Request an OTP code to be sent to the registered email for password
        reset.
      parameters:
      - description: Registered email
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ResponseNoData'
      summary: Forgot password
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user with email and password, returns access & refresh
        token.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ResponseNoData'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ResponseNoData'
      summary: Login
      tags:
      - Auth
  /auth/logout:
    post:
      description: Clear authentication cookies.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ResponseNoData'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - Auth
  /auth/me:
    get:
      description: Get the profile of the currently authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.UserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ResponseNoData'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - Auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Set a new password after OTP verification. Requires a temp token
        (from verify-otp) in Authorization header.
      parameters:
      - description: New password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ResponseNoData'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ResponseNoData'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ResponseNoData'
      security:
      - TempToken: []
      summary: Reset password
      tags:
      - Auth
  /auth/verify-otp:
    post:
      consumes:
      - application/json
      description: Verify the OTP code sent to email. Requires a temp token (from
        forgot-password) in Authorization header.
      parameters:
      - description: OTP code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.VerifyOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ResponseNoData'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ResponseNoData'
      security:
      - TempToken: []
      summary: Verify OTP
      tags:
      - Auth
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT access token.
    in: header
    name: Authorization
    type: apiKey
  TempToken:
    description: Type "Bearer" followed by a space and temp JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"

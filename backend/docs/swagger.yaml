securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT access token.
    in: header
    name: Authorization
    type: apiKey
  TempToken:
    description: Type "Bearer" followed by a space and temp JWT token.
    in: header
    name: Authorization
    type: apiKey

basePath: /api/v1
definitions:
  model.AddParticipantRequest:
    properties:
      email:
        type: string
      name:
        type: string
      nim:
        type: string
      university:
        type: string
    required:
    - email
    - name
    - nim
    type: object
  model.AnswerKeyResponse:
    properties:
      correct_option_public_id:
        type: string
      public_id:
        type: string
      question_public_id:
        type: string
      updated_at:
        type: string
    type: object
  model.AssignSectionRequest:
    properties:
      position:
        minimum: 1
        type: integer
      section_public_id:
        type: string
    required:
    - position
    - section_public_id
    type: object
  model.AuthResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      temp_token:
        type: string
      user:
        $ref: '#/definitions/model.UserResponse'
    type: object
  model.BulkScoreConversionRequest:
    properties:
      conversions:
        items:
          $ref: '#/definitions/model.ScoreConversionRequest'
        minItems: 1
        type: array
    required:
    - conversions
    type: object
  model.BulkScoreConversionResponse:
    properties:
      total_saved:
        type: integer
    type: object
  model.ChangePasswordRequest:
    properties:
      confirm_new_password:
        type: string
      new_password:
        minLength: 8
        type: string
      old_password:
        type: string
    required:
    - confirm_new_password
    - new_password
    - old_password
    type: object
  model.ExamOptionResponse:
    properties:
      label:
        type: string
      option_text:
        type: string
      position:
        type: integer
      public_id:
        type: string
    type: object
  model.ExamQuestionResponse:
    properties:
      audio_url:
        type: string
      image_url:
        type: string
      number:
        type: integer
      options:
        items:
          $ref: '#/definitions/model.ExamOptionResponse'
        type: array
      passage:
        type: string
      public_id:
        type: string
      question:
        type: string
    type: object
  model.ExamResultResponse:
    properties:
      certificate_url:
        type: string
      final_score:
        type: integer
      min_passing_grade:
        type: integer
      period_title:
        type: string
      section_breakdowns:
        items:
          $ref: '#/definitions/model.SectionBreakdownResponse'
        type: array
      status:
        type: string
    type: object
  model.ExamSectionResponse:
    properties:
      position:
        type: integer
      public_id:
        type: string
      questions:
        items:
          $ref: '#/definitions/model.ExamQuestionResponse'
        type: array
      title:
        type: string
    type: object
  model.ExamSessionResponse:
    properties:
      period_public_id:
        type: string
      sections:
        items:
          $ref: '#/definitions/model.ExamSectionResponse'
        type: array
      title:
        type: string
    type: object
  model.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  model.ImportErrorDetail:
    properties:
      email:
        type: string
      message:
        type: string
      row:
        type: integer
    type: object
  model.ImportParticipantResponse:
    properties:
      errors:
        items:
          $ref: '#/definitions/model.ImportErrorDetail'
        type: array
      total_imported:
        type: integer
      total_skipped:
        type: integer
    type: object
  model.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  model.OptionRequest:
    properties:
      option_text:
        type: string
    required:
    - option_text
    type: object
  model.OptionResponse:
    properties:
      label:
        type: string
      option_text:
        type: string
      position:
        type: integer
      public_id:
        type: string
    type: object
  model.ParticipantPeriodDetailResponse:
    properties:
      end_time:
        type: string
      month:
        type: string
      participant_status:
        type: string
      public_id:
        type: string
      start_time:
        type: string
      title:
        type: string
      year:
        type: integer
    type: object
  model.ParticipantPeriodListResponse:
    properties:
      period:
        $ref: '#/definitions/model.PeriodSimpleInfo'
      public_id:
        type: string
      score:
        type: integer
      status:
        type: string
    type: object
  model.ParticipantResponse:
    properties:
      created_at:
        type: string
      period_public_id:
        type: string
      public_id:
        type: string
      score:
        type: integer
      status:
        type: string
      updated_at:
        type: string
      user:
        $ref: '#/definitions/model.UserResponse'
    type: object
  model.PeriodDetailResponse:
    properties:
      certificate_exp_month:
        type: string
      certificate_url:
        type: string
      created_at:
        type: string
      end_time:
        type: string
      max_passing_grade:
        type: integer
      min_passing_grade:
        type: integer
      month:
        type: string
      public_id:
        type: string
      sections:
        items:
          $ref: '#/definitions/model.PeriodSectionResponse'
        type: array
      start_time:
        type: string
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
      year:
        type: integer
    type: object
  model.PeriodResponse:
    properties:
      certificate_exp_month:
        type: string
      certificate_url:
        type: string
      created_at:
        type: string
      end_time:
        type: string
      max_passing_grade:
        type: integer
      min_passing_grade:
        type: integer
      month:
        type: string
      public_id:
        type: string
      start_time:
        type: string
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
      year:
        type: integer
    type: object
  model.PeriodSectionResponse:
    properties:
      period_section_public_id:
        type: string
      position:
        type: integer
      section_public_id:
        type: string
      title:
        type: string
    type: object
  model.PeriodSimpleInfo:
    properties:
      end_time:
        type: string
      public_id:
        type: string
      start_time:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  model.QuestionDetailResponse:
    properties:
      audio_url:
        type: string
      correct_option_public_id:
        type: string
      image_url:
        type: string
      number:
        type: integer
      options:
        items:
          $ref: '#/definitions/model.OptionResponse'
        type: array
      passage:
        type: string
      public_id:
        type: string
      question:
        type: string
    type: object
  model.QuestionResponse:
    properties:
      audio_url:
        type: string
      image_url:
        type: string
      number:
        type: integer
      passage:
        type: string
      public_id:
        type: string
      question:
        type: string
    type: object
  model.ReorderOptionsRequest:
    properties:
      option_public_ids:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - option_public_ids
    type: object
  model.ReorderQuestionsRequest:
    properties:
      question_public_ids:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - question_public_ids
    type: object
  model.ReorderSectionsRequest:
    properties:
      section_public_ids:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - section_public_ids
    type: object
  model.ResetPasswordRequest:
    properties:
      confirm_new_password:
        type: string
      new_password:
        minLength: 8
        type: string
    required:
    - confirm_new_password
    - new_password
    type: object
  model.SaveAnswerRequest:
    properties:
      option_public_id:
        type: string
      question_public_id:
        type: string
    required:
    - option_public_id
    - question_public_id
    type: object
  model.SaveAnswerResponse:
    properties:
      option_public_id:
        type: string
      question_public_id:
        type: string
      updated_at:
        type: string
    type: object
  model.ScoreConversionRequest:
    properties:
      correct_count:
        minimum: 0
        type: integer
      scaled_score:
        minimum: 0
        type: integer
      section_type:
        enum:
        - listening
        - structure
        - reading
        type: string
    required:
    - section_type
    type: object
  model.ScoreConversionResponse:
    properties:
      correct_count:
        type: integer
      id:
        type: integer
      scaled_score:
        type: integer
      section_type:
        type: string
    type: object
  model.SectionBreakdownResponse:
    properties:
      correct_count:
        type: integer
      scaled_score:
        type: integer
      section_title:
        type: string
    type: object
  model.SectionDetailResponse:
    properties:
      created_at:
        type: string
      public_id:
        type: string
      questions:
        items:
          $ref: '#/definitions/model.QuestionDetailResponse'
        type: array
      section_type:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  model.SectionRequest:
    properties:
      section_type:
        enum:
        - listening
        - structure
        - reading
        type: string
      title:
        type: string
    required:
    - section_type
    - title
    type: object
  model.SectionResponse:
    properties:
      created_at:
        type: string
      public_id:
        type: string
      section_type:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  model.SubmitExamResponse:
    properties:
      period_public_id:
        type: string
      status:
        type: string
      submitted_at:
        type: string
    type: object
  model.UpdateParticipantRequest:
    properties:
      name:
        type: string
      nim:
        type: string
      score:
        type: integer
      status:
        enum:
        - registered
        - started
        - completed
        type: string
      university:
        type: string
    type: object
  model.UpsertAnswerKeyRequest:
    properties:
      option_public_id:
        type: string
    required:
    - option_public_id
    type: object
  model.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      name:
        type: string
      nim:
        type: string
      public_id:
        type: string
      role:
        type: string
      university:
        type: string
      updated_at:
        type: string
    type: object
  model.VerifyOTPRequest:
    properties:
      otp_code:
        type: string
    required:
    - otp_code
    type: object
  response.PaginationMeta:
    properties:
      filter:
        type: string
      limit:
        type: integer
      page:
        type: integer
      sort:
        type: string
      total_datas:
        type: integer
      total_pages:
        type: integer
    type: object
  response.Response:
    properties:
      data: {}
      message:
        type: string
      response_code:
        type: integer
      status:
        type: string
    type: object
  response.ResponseNoData:
    properties:
      message:
        type: string
      response_code:
        type: integer
      status:
        type: string
    type: object
  response.ResponsePaginated:
    properties:
      data: {}
      message:
        type: string
      meta:
        $ref: '#/definitions/response.PaginationMeta'
      response_code:
        type: integer
      status:
        type: string
    type: object
info:
  contact: {}
  description: API documentation for Siuji TOEFL exam application.
  title: Siuji API
  version: "1.0"
paths:
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Change password for the currently authenticated user.
      parameters:
      - description: Old and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ResponseNoData'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ResponseNoData'
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - Auth
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Request an OTP code to be sent to the registered email for password
        reset.
      parameters:
      - description: Registered email
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ResponseNoData'
      summary: Forgot password
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user with email and password, returns access & refresh
        token.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ResponseNoData'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ResponseNoData'
      summary: Login
      tags:
      - Auth
  /auth/logout:
    post:
      description: Clear authentication cookies.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ResponseNoData'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - Auth
  /auth/me:
    get:
      description: Get the profile of the currently authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.UserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ResponseNoData'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - Auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Set a new password after OTP verification. Requires a temp token
        (from verify-otp) in Authorization header.
      parameters:
      - description: New password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ResponseNoData'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ResponseNoData'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ResponseNoData'
      security:
      - TempToken: []
      summary: Reset password
      tags:
      - Auth
  /auth/verify-otp:
    post:
      consumes:
      - application/json
      description: Verify the OTP code sent to email. Requires a temp token (from
        forgot-password) in Authorization header.
      parameters:
      - description: OTP code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.VerifyOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ResponseNoData'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ResponseNoData'
      security:
      - TempToken: []
      summary: Verify OTP
      tags:
      - Auth
  /options/{option_public_id}:
    delete:
      parameters:
      - description: Option public ID
        in: path
        name: option_public_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ResponseNoData'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ResponseNoData'
      security:
      - BearerAuth: []
      summary: Delete option
      tags:
      - Option
    put:
      consumes:
      - application/json
      parameters:
      - description: Option public ID
        in: path
        name: option_public_id
        required: true
        type: string
      - description: Option data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.OptionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.OptionResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ResponseNoData'
      security:
      - BearerAuth: []
      summary: Update option
      tags:
      - Option
  /participant/periods:
    get:
      description: Get periods the logged-in participant is registered for.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.ParticipantPeriodListResponse'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: List my exam periods
      tags:
      - ParticipantExam
  /participant/periods/{period_public_id}:
    get:
      parameters:
      - description: Period public ID
        in: path
        name: period_public_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.ParticipantPeriodDetailResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ResponseNoData'
      security:
      - BearerAuth: []
      summary: Get my exam period detail
      tags:
      - ParticipantExam
  /participant/periods/{period_public_id}/answers:
    post:
      consumes:
      - application/json
      description: Can be called repeatedly while the exam is in progress — upserts
        by question.
      parameters:
      - description: Period public ID
        in: path
        name: period_public_id
        required: true
        type: string
      - description: Answer
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.SaveAnswerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.SaveAnswerResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ResponseNoData'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ResponseNoData'
      security:
      - BearerAuth: []
      summary: Save/update an answer
      tags:
      - ParticipantExam
  /participant/periods/{period_public_id}/result:
    get:
      description: Returns the final score, section breakdown, and certificate URL
        (generated on first request if passed).
      parameters:
      - description: Period public ID
        in: path
        name: period_public_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.ExamResultResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ResponseNoData'
      security:
      - BearerAuth: []
      summary: Get exam result
      tags:
      - ParticipantExam
  /participant/periods/{period_public_id}/start:
    post:
      description: Marks the exam as started and returns all sections/questions (without
        correct answers).
      parameters:
      - description: Period public ID
        in: path
        name: period_public_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.ExamSessionResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ResponseNoData'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ResponseNoData'
      security:
      - BearerAuth: []
      summary: Start exam
      tags:
      - ParticipantExam
  /participant/periods/{period_public_id}/submit:
    post:
      description: Finalizes the exam, computes section scores and the final TOEFL
        score.
      parameters:
      - description: Period public ID
        in: path
        name: period_public_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.SubmitExamResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ResponseNoData'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ResponseNoData'
      security:
      - BearerAuth: []
      summary: Submit exam
      tags:
      - ParticipantExam
  /periods:
    get:
      description: Get a paginated list of exam periods.
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Search by title
        in: query
        name: filter
        type: string
      - description: Sort field, e.g. -created_at
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ResponsePaginated'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.PeriodResponse'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: List periods
      tags:
      - Period
    post:
      consumes:
      - multipart/form-data
      description: Create a new exam period with a certificate template image.
      parameters:
      - description: Period title
        in: formData
        name: title
        required: true
        type: string
